# Copy to .github/workflows/agentstack-sync.yml in the SOURCE repository.
name: AgentStack repository sync
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["docs/**", "epics/**", "AGENTS.md", "CLAUDE.md"]
  workflow_run:
    workflows: ["CI"] # Replace with YOUR build workflow names, never this sync workflow.
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: agentstack-repository-sync
  cancel-in-progress: false
jobs:
  refresh:
    # Do not use privileged workflow_run credentials for fork/PR-originated runs.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AGENTSTACK_ENGINE_REF: ${{ vars.AGENTSTACK_ENGINE_REF }}
    steps:
      - name: Require a pinned AgentStack engine commit
        shell: bash
        run: '[[ "$AGENTSTACK_ENGINE_REF" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: builtx-pro/agentstack
          ref: ${{ vars.AGENTSTACK_ENGINE_REF }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Build the pinned client
        run: |
          npm ci --ignore-scripts
          npm run build --workspace @agentstack/sdk
          npm run build --workspace @agentstack/cli
      - name: Stage provider changes and refresh verified pipeline status
        env:
          AGENTSTACK_URL: ${{ vars.AGENTSTACK_URL }}
          AGENTSTACK_TOKEN: ${{ secrets.AGENTSTACK_TOKEN }}
          AGENTSTACK_PROJECT: ${{ vars.AGENTSTACK_PROJECT }}
          AGENTSTACK_CONNECTION: ${{ vars.AGENTSTACK_CONNECTION }}
        run: node packages/cli/dist/main.js --project "$AGENTSTACK_PROJECT" --timeout-ms 120000 repositories refresh "$AGENTSTACK_CONNECTION"
