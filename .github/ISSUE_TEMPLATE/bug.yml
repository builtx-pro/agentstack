name: Bug report
description: Report a reproducible problem using synthetic data.
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use synthetic examples. Never include credentials or customer data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AgentStack version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Docker version and installation method. Redact private hostnames.
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Synthetic screenshots or relevant log lines. Never upload a database, token or customer material.
