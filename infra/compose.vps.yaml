# Linux-only fresh-VPS overlay. Run through tools/setup/install-vps.sh.
services:
  caddy:
    image: caddy:2-alpine
    network_mode: host
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    environment:
      AGENTSTACK_DOMAIN: ${AGENTSTACK_DOMAIN:?Run the VPS installer}
      ACME_EMAIL: ${ACME_EMAIL:?Run the VPS installer}
    volumes:
      - ${AGENTSTACK_INSTALL_DIR:?Run the VPS installer}/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp
volumes:
  caddy_data:
  caddy_config:
